<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break The Bottle - Community</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --glow-color: rgba(52, 211, 153, 0.4);
            --bg-dark: #020617;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --emerald: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-color: var(--bg-dark);
            position: relative;
        }

        /* Smooth Aurora Background */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            background: linear-gradient(125deg, #020617, #0f172a, #1e1b4b, #064e3b, #020617);
            background-size: 400% 400%;
            animation: auroraShift 25s ease-in-out infinite alternate;
        }

        .aurora-glow, .aurora-glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: floatGlow 20s ease-in-out infinite alternate;
        }

        .aurora-glow {
            width: 60vw; height: 60vh;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            top: 10%; left: -10%;
        }

        .aurora-glow-2 {
            width: 70vw; height: 70vh;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
            bottom: -10%; right: -10%;
            animation-direction: alternate-reverse;
            animation-duration: 25s;
        }

        @keyframes auroraShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5vw, -5vh) scale(1.1); }
        }

        /* Screen Management */
        .screen {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Components */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 30px 60px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        /* Dashboard Specifics */
        .personal-card {
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
        }

        /* Metallic Shimmer Effect */
        .personal-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: skewX(-25deg);
            animation: shimmer 6s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { left: -150%; }
            20%, 100% { left: 250%; }
        }

        .brand-title {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--emerald);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .number-display {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.9);
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.5) 100%);
            -webkit-background-clip: text;
            text-shadow: 0 0 40px var(--glow-color);
            animation: gentlePulse 4s ease-in-out infinite;
            transform: translateZ(30px);
        }

        @keyframes gentlePulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 30px var(--glow-color)); }
            50% { filter: brightness(1.2) drop-shadow(0 0 50px rgba(52, 211, 153, 0.6)); }
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            transform: translateZ(20px);
        }

        /* Community Section */
        .community-section {
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-bottom: 1rem;
            text-align: left;
            padding-left: 1rem;
        }

        .community-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--emerald) transparent;
        }

        .community-list::-webkit-scrollbar { width: 6px; }
        .community-list::-webkit-scrollbar-thumb { background: var(--emerald); border-radius: 10px; }

        .member-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .member-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
            border-color: rgba(52, 211, 153, 0.3);
        }

        .member-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
        }

        .member-id {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            font-family: monospace;
            margin-top: 0.2rem;
        }

        .member-day {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--emerald);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1;
        }

        .member-day span {
            font-size: 0.7rem;
            font-weight: 400;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Forms & Inputs */
        .form-group {
            width: 100%;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        .input-field {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            color-scheme: dark;
        }

        .input-field:focus {
            border-color: var(--emerald);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: none;
            margin-top: 0.5rem;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 20px;
        }
        
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--emerald);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="aurora-glow"></div>
        <div class="aurora-glow-2"></div>
    </div>

    <!-- Screen 1: Loading -->
    <main id="screen-loading" class="screen active">
        <div class="loading-spinner"></div>
        <p style="color: rgba(255,255,255,0.6); letter-spacing: 2px;">CONNECTING...</p>
    </main>

    <!-- Screen 2: Onboarding -->
    <main id="screen-onboarding" class="screen">
        <div class="brand-title">Break The Bottle</div>
        <div class="glass-card">
            <h2 style="margin-bottom: 2rem; font-size: 1.8rem;">Start Your Journey</h2>
            
            <div class="form-group">
                <label for="user-name">What is your name?</label>
                <input type="text" id="user-name" class="input-field" placeholder="e.g. Achan, John...">
            </div>

            <div class="form-group">
                <label for="start-date">When did your alcohol-free journey begin?</label>
                <input type="date" id="start-date" class="input-field">
            </div>

            <button class="btn-primary" onclick="submitProfile()">Join Community</button>
            <button class="btn-primary btn-secondary" onclick="setToday()">I am starting today</button>
            
            <div id="onboarding-error" class="error-message"></div>
        </div>
    </main>

    <!-- Screen 3: Dashboard -->
    <main id="screen-dashboard" class="screen">
        <div class="brand-title">Break The Bottle</div>
        
        <div class="glass-card personal-card" id="tilt-card">
            <div id="personal-counter" class="number-display">0</div>
            <h2 class="subtitle">Day<span id="plural-s">s</span> of Strength and Clarity</h2>
        </div>

        <div class="community-section">
            <h3 class="section-title">The Community</h3>
            <div class="community-list" id="community-list">
                <!-- Community members will be injected here -->
                <div style="text-align:center; padding: 2rem; color: rgba(255,255,255,0.5);">
                    Loading members...
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Env Variables provided by platform
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'break-the-bottle-demo';
        const FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        const app = initializeApp(FIREBASE_CONFIG);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserUid = null;
        let unsubscribeCommunity = null;
        const MS_PER_DAY = 1000 * 60 * 60 * 24;

        // UI Management Functions
        window.showScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        };

        window.setToday = function() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('start-date').value = `${yyyy}-${mm}-${dd}`;
        };

        // Logic to calculate ONGOING day (Difference + 1)
        function calculateOngoingDay(startDateStr) {
            const start = new Date(startDateStr + 'T00:00:00Z');
            const now = new Date();
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            
            const diffTime = today - start;
            const completedDays = Math.floor(diffTime / MS_PER_DAY);
            
            // If they started today, it's their 1st day (ongoing).
            // If they started yesterday (1 day completed), today is their 2nd day (ongoing).
            const ongoingDay = completedDays + 1;
            
            // Prevent negative days if they accidentally pick a future date
            return ongoingDay > 0 ? ongoingDay : 1; 
        }

        // Add 3D Tilt Effect to Dashboard Card
        function initTiltEffect() {
            const card = document.getElementById('tilt-card');
            
            document.addEventListener('mousemove', (e) => {
                if(!document.getElementById('screen-dashboard').classList.contains('active')) return;
                
                const rect = card.getBoundingClientRect();
                
                // Only tilt if mouse is roughly near the card to prevent wild swinging when interacting with community list
                const isHovering = (
                    e.clientX > rect.left - 100 && e.clientX < rect.right + 100 &&
                    e.clientY > rect.top - 100 && e.clientY < rect.bottom + 100
                );

                if (isHovering) {
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -10; // Max 10deg
                    const rotateY = ((x - centerX) / centerX) * 10;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                } else {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
                }
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            });
        }

        window.submitProfile = async function() {
            const name = document.getElementById('user-name').value.trim();
            const startDate = document.getElementById('start-date').value;
            const errorEl = document.getElementById('onboarding-error');
            
            errorEl.innerText = '';

            if (!name) return errorEl.innerText = 'Please enter your name.';
            if (!startDate) return errorEl.innerText = 'Please select your start date.';
            if (!currentUserUid) return errorEl.innerText = 'Authentication error. Try reloading.';

            const originalBtnText = document.querySelector('.btn-primary').innerText;
            document.querySelector('.btn-primary').innerText = 'Saving...';

            try {
                // RULE: Strict Path -> artifacts/{appId}/public/data/{collectionName}
                const profileRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', currentUserUid);
                await setDoc(profileRef, {
                    name: name,
                    startDate: startDate,
                    joinedAt: serverTimestamp(),
                    uid: currentUserUid
                });
                
                loadDashboard(name, startDate);
            } catch (error) {
                console.error("Error saving profile:", error);
                errorEl.innerText = 'Failed to save profile. Please try again.';
                document.querySelector('.btn-primary').innerText = originalBtnText;
            }
        };

        function loadDashboard(name, startDate) {
            showScreen('screen-dashboard');
            
            const ongoingDay = calculateOngoingDay(startDate);
            document.getElementById('personal-counter').innerText = ongoingDay;
            
            // Ordinal suffix (st, nd, rd, th) makes grammatical sense for "ongoing day", 
            // but the prompt asked for "53rd day of strength...". 
            // We will stick to the requested "DAYS OF STRENGTH AND CLARITY" but remove the 'S' if it's day 1
            if(ongoingDay === 1) {
                document.getElementById('plural-s').style.display = 'none';
            } else {
                document.getElementById('plural-s').style.display = 'inline';
            }

            initTiltEffect();
            subscribeToCommunity();
        }

        function getOrdinalSuffix(i) {
            let j = i % 10, k = i % 100;
            if (j == 1 && k != 11) return i + "st";
            if (j == 2 && k != 12) return i + "nd";
            if (j == 3 && k != 13) return i + "rd";
            return i + "th";
        }

        function subscribeToCommunity() {
            if (unsubscribeCommunity) unsubscribeCommunity();

            // RULE: No complex queries. Fetch all, sort in memory.
            const membersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'members');
            
            unsubscribeCommunity = onSnapshot(membersRef, (snapshot) => {
                const members = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(data.name && data.startDate) {
                        members.push({
                            ...data,
                            ongoingDay: calculateOngoingDay(data.startDate)
                        });
                    }
                });

                // Sort by highest day count (most veteran members first)
                members.sort((a, b) => b.ongoingDay - a.ongoingDay);
                renderCommunityList(members);
            }, (error) => {
                console.error("Community listener error:", error);
                document.getElementById('community-list').innerHTML = 
                    `<div style="color: #ef4444; text-align: center; padding: 1rem;">Failed to load community.</div>`;
            });
        }

        function renderCommunityList(members) {
            const listEl = document.getElementById('community-list');
            listEl.innerHTML = '';

            if (members.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 2rem; color: rgba(255,255,255,0.5);">Be the first to join the community!</div>`;
                return;
            }

            members.forEach(member => {
                const isMe = member.uid === currentUserUid;
                const card = document.createElement('div');
                card.className = 'member-card';
                if (isMe) card.style.borderColor = 'rgba(52, 211, 153, 0.6)'; // Highlight current user

                card.innerHTML = `
                    <div class="member-info">
                        <div class="member-name">${member.name} ${isMe ? '(You)' : ''}</div>
                        <div class="member-id">ID: ${member.uid}</div>
                    </div>
                    <div class="member-day">
                        ${member.ongoingDay}
                        <span>ONGOING DAY</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        async function initializeAuth() {
            // Check for injected token first, otherwise fallback to anonymous
            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            
            try {
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                document.getElementById('screen-loading').innerHTML = `
                    <div style="color: #ef4444; padding: 2rem; text-align: center;">
                        Authentication failed. Please check permissions or reload.
                    </div>`;
            }
        }

        // Listen for auth state changes
        onAuthStateChanged(auth, async (user) => {
            if (!user) return; // Guard clause
            
            currentUserUid = user.uid;

            try {
                // Check if user already has a profile
                const profileRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', currentUserUid);
                const profileSnap = await getDoc(profileRef);

                if (profileSnap.exists()) {
                    // Profile exists -> Go to Dashboard
                    const data = profileSnap.data();
                    loadDashboard(data.name, data.startDate);
                } else {
                    // No profile -> Go to Onboarding
                    showScreen('screen-onboarding');
                }
            } catch (error) {
                console.error("Error fetching profile:", error);
                document.getElementById('screen-loading').innerHTML = `
                    <div style="color: #ef4444; padding: 2rem; text-align: center;">
                        Error loading profile. Please ensure Firebase configuration is correct.
                    </div>`;
            }
        });

        // Start Auth flow
        initializeAuth();

    </script>
</body>
</html>
