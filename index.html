<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Day of Strength and Clarity</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --glow-color: rgba(167, 243, 208, 0.6);
            --bg-dark: #020617;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Prevent highlighting when tapping on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            min-height: 100dvh; /* Accounts for mobile browser UI bars */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-dark);
            position: relative;
            /* Prevent accidental text selection on phones */
            user-select: none; 
            -webkit-user-select: none;
        }

        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(125deg, #020617, #0f172a, #1e1b4b, #064e3b, #020617);
            background-size: 400% 400%;
            animation: auroraShift 25s ease-in-out infinite alternate;
        }

        .aurora-glow {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            top: 20%;
            left: -10%;
            animation: floatGlow 20s ease-in-out infinite alternate;
        }

        .aurora-glow-2 {
            position: absolute;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            bottom: -10%;
            right: -10%;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes auroraShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, -10vh) scale(1.2); }
        }

        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .number-display {
            font-size: clamp(7rem, 22vw, 15rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 50px var(--glow-color),
                0 0 100px rgba(52, 211, 153, 0.4);
            animation: gentlePulse 4s ease-in-out infinite;
        }

        .ordinal-sup {
            font-size: 0.35em;
            vertical-align: super;
            margin-left: 4px;
            font-weight: 600;
            opacity: 0.9;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.2); }
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            animation: fadeIn 2s ease-out;
        }

        .settings-btn {
            position: fixed;
            bottom: max(25px, env(safe-area-inset-bottom));
            right: max(25px, env(safe-area-inset-right));
            z-index: 20;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 15px; /* Larger tap target for phones */
            touch-action: manipulation;
        }

        .settings-btn:hover, .settings-btn:active {
            color: rgba(255, 255, 255, 0.9);
            transform: rotate(45deg);
        }

        .settings-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal h3 {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        .date-input {
            width: 100%;
            padding: 15px; /* Larger padding for mobile typing */
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            color-scheme: dark;
            appearance: none;
        }

        .date-input:focus {
            border-color: rgba(52, 211, 153, 0.8);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #10b981;
            color: #020617;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 0.8rem;
            touch-action: manipulation;
        }

        .btn:hover, .btn:active { background: #34d399; }
        
        .btn-cancel {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-cancel:hover, .btn-cancel:active { background: rgba(255, 255, 255, 0.1); color: white; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="aurora-glow"></div>
        <div class="aurora-glow-2"></div>
    </div>

    <main class="content-container">
        <div id="day-counter" class="number-display">1<sup class="ordinal-sup">st</sup></div>
        <h2 id="subtitle" class="subtitle">Day of Strength and Clarity</h2>
    </main>

    <button class="settings-btn" onclick="toggleModal(true)" aria-label="Settings">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </button>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3>Start Date</h3>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 1.5rem;">
                Saved automatically to this device.
            </p>
            <input type="date" id="date-input" class="date-input">
            <button class="btn" onclick="updateApp()">Update Timeline</button>
            <button class="btn btn-cancel" onclick="toggleModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // Use a generic default or let the user choose
        const DEFAULT_DATE = '2026-08-04'; 
        const MS_PER_DAY = 1000 * 60 * 60 * 24;

        function getOrdinalSuffix(n) {
            const absN = Math.abs(n);
            const remainder100 = absN % 100;
            if (remainder100 >= 11 && remainder100 <= 13) {
                return 'th';
            }
            switch (absN % 10) {
                case 1:  return 'st';
                case 2:  return 'nd';
                case 3:  return 'rd';
                default: return 'th';
            }
        }

        function calculateOrdinalDay(startDateStr) {
            const start = new Date(startDateStr + 'T00:00:00Z');
            const now = new Date();
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            
            const diffTime = today - start;
            const fullDaysElapsed = Math.floor(diffTime / MS_PER_DAY);
            
            return fullDaysElapsed >= 0 ? fullDaysElapsed + 1 : fullDaysElapsed;
        }

        function initApp(forcedDate = null) {
            let since = forcedDate;

            // 1. Check URL parameters first (so sharing web links still works)
            if (!since) {
                const params = new URLSearchParams(window.location.search);
                since = params.get('since');
                if (since) {
                    localStorage.setItem('clarityStartDate', since);
                }
            }

            // 2. Check local storage (Crucial for mobile PWA usage)
            if (!since) {
                since = localStorage.getItem('clarityStartDate');
            }
            
            // 3. Fallback
            if (!since || isNaN(new Date(since).getTime())) {
                since = DEFAULT_DATE;
            }

            // Lock it into local storage
            localStorage.setItem('clarityStartDate', since);

            // Set up visuals
            const currentDayNumber = calculateOrdinalDay(since);
            const counterElement = document.getElementById('day-counter');
            const subtitleElement = document.getElementById('subtitle');
            
            if (currentDayNumber > 0) {
                const suffix = getOrdinalSuffix(currentDayNumber);
                counterElement.innerHTML = `${currentDayNumber}<sup class="ordinal-sup">${suffix}</sup>`;
                subtitleElement.innerText = "Day of Strength and Clarity";
            } else {
                const daysUntil = Math.abs(currentDayNumber);
                counterElement.innerText = daysUntil;
                subtitleElement.innerText = `Days Until Journey Begins`;
            }

            document.getElementById('date-input').value = since;
            
            // Sync URL without reloading so sharing works
            const url = new URL(window.location);
            url.searchParams.set('since', since);
            try {
                window.history.replaceState({}, '', url);
            } catch (e) {}
        }

        function toggleModal(show) {
            const modal = document.getElementById('settings-modal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function updateApp() {
            const selectedDate = document.getElementById('date-input').value;
            if (!selectedDate) return;
            initApp(selectedDate);
            toggleModal(false);
        }

        window.addEventListener('DOMContentLoaded', () => initApp());
    </script>
</body>
</html>
