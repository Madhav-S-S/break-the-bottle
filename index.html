<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days of Strength and Clarity</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --glow-color: rgba(167, 243, 208, 0.6); /* Soft emerald glow */
            --bg-dark: #020617; /* Very dark slate */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-dark);
            position: relative;
        }

        /* Smooth, slow-shifting aurora gradient background - strictly no particles */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(125deg, #020617, #0f172a, #1e1b4b, #064e3b, #020617);
            background-size: 400% 400%;
            animation: auroraShift 25s ease-in-out infinite alternate;
        }

        /* Large blurred shapes to create an ethereal aurora feel */
        .aurora-glow {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            top: 20%;
            left: -10%;
            animation: floatGlow 20s ease-in-out infinite alternate;
        }

        .aurora-glow-2 {
            position: absolute;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            bottom: -10%;
            right: -10%;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes auroraShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, -10vh) scale(1.2); }
        }

        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        /* The massive glowing number */
        .number-display {
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 50px var(--glow-color),
                0 0 100px rgba(52, 211, 153, 0.4);
            animation: gentlePulse 4s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.2); }
        }

        /* Strict requirement: Text directly below the number */
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            animation: fadeIn 2s ease-out;
        }

        /* Settings Icon (Bottom Right) */
        .settings-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 20;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
        }

        .settings-btn:hover {
            color: rgba(255, 255, 255, 0.8);
            transform: rotate(45deg);
        }

        .settings-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Date Picker Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal h3 {
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        .date-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            color-scheme: dark; /* Makes the native date picker calendar icon white */
        }

        .date-input:focus {
            border-color: rgba(52, 211, 153, 0.6);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #10b981; /* Emerald green */
            color: #020617;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 0.8rem;
        }

        .btn:hover { background: #34d399; }
        
        .btn-cancel {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Pure CSS Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora-glow"></div>
        <div class="aurora-glow-2"></div>
    </div>

    <!-- Main Content -->
    <main class="content-container">
        <div id="day-counter" class="number-display">0</div>
        <h2 class="subtitle">Days of Strength and Clarity</h2>
    </main>

    <!-- Settings Button -->
    <button class="settings-btn" onclick="toggleModal(true)" aria-label="Settings">
        <!-- Minimalist Gear Icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </button>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3>Start Date</h3>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 1.5rem;">
                Changes will update your URL. Bookmark the new link to save it.
            </p>
            <input type="date" id="date-input" class="date-input">
            <button class="btn" onclick="updateUrl()">Update Timeline</button>
            <button class="btn btn-cancel" onclick="toggleModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // Configuration
        const DEFAULT_DATE = '2026-08-04';
        const MS_PER_DAY = 1000 * 60 * 60 * 24;

        // Core logic to calculate days
        function calculateDays(startDateStr) {
            // Appending T00:00:00Z ensures midnight UTC parsing, preventing timezone/daylight saving errors
            const start = new Date(startDateStr + 'T00:00:00Z');
            const now = new Date();
            // Compare against today at midnight UTC
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            
            const diffTime = today - start;
            return Math.floor(diffTime / MS_PER_DAY);
        }

        // Initialize application based on URL parameters or forced updates
        function initApp(forcedDate = null) {
            let since = forcedDate;

            if (!since) {
                const params = new URLSearchParams(window.location.search);
                since = params.get('since');
            }
            
            // Fallback to default if date is missing or invalid
            if (!since || isNaN(new Date(since).getTime())) {
                since = DEFAULT_DATE;
                // Silently update URL to the default if it was empty so the user knows they can share it
                const url = new URL(window.location);
                url.searchParams.set('since', since);
                
                // Wrap in try-catch to prevent crashes in sandboxed iframe environments (blob: URLs)
                try {
                    window.history.replaceState({}, '', url);
                } catch (e) {
                    console.warn("History API restricted in this environment. Using memory state.");
                }
            }

            const days = calculateDays(since);
            const counterElement = document.getElementById('day-counter');
            
            // Handle negative days (future dates) gracefully, though usually it's in the past
            if (days >= 0) {
                counterElement.innerText = days;
            } else {
                counterElement.innerText = Math.abs(days);
            }

            // Sync the input in the modal
            document.getElementById('date-input').value = since;
        }

        // Modal Management
        function toggleModal(show) {
            const modal = document.getElementById('settings-modal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function updateUrl() {
            const selectedDate = document.getElementById('date-input').value;
            if (!selectedDate) return;

            const url = new URL(window.location);
            url.searchParams.set('since', selectedDate);
            
            // Update browser URL without reloading
            try {
                window.history.pushState({}, '', url);
            } catch (e) {
                console.warn("History API restricted in this environment. URL not updated visually.");
            }
            
            // Recalculate and close, passing the date directly since pushState might have failed
            initApp(selectedDate);
            toggleModal(false);
        }

        // Start app on load
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
