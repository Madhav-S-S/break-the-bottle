    <style>
        :root {
            --text-color: #ffffff;
            --glow-color: rgba(16, 185, 129, 0.6); /* Default Emerald */
            --glow-secondary: rgba(56, 189, 248, 0.5); /* Default Blue */
            --bg-dark: #020617;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            min-height: 100vh; min-height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; background-color: var(--bg-dark); position: relative;
            user-select: none; -webkit-user-select: none;
            transition: all 1s ease;
        }

        /* --- MILESTONE THEME CHANGES --- */
        body.milestone-day {
            --glow-color: rgba(250, 204, 21, 0.8); /* Golden Celebration Glow */
            --glow-secondary: rgba(236, 72, 153, 0.6); /* Pink/Magenta Celebration Glow */
        }
        body.milestone-day .aurora-bg {
            background: linear-gradient(125deg, #020617, #31102f, #451a03, #1e1b4b, #020617);
        }

        /* App Branding (Top Left) */
        .brand-logo {
            position: absolute; top: max(25px, env(safe-area-inset-top)); left: max(25px, env(safe-area-inset-left));
            font-size: 0.9rem; font-weight: 800; letter-spacing: 2px; color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase; z-index: 20; transition: color 0.3s ease;
        }
        .brand-logo:hover, .brand-logo:active { color: rgba(255, 255, 255, 0.8); }

        /* Developer Credits (Bottom Center) */
        .developer-credits {
            position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            font-size: 0.7rem; font-weight: 400; letter-spacing: 1px; color: rgba(255, 255, 255, 0.2);
            z-index: 20; white-space: nowrap; display: flex; align-items: center; gap: 8px;
        }
        .developer-credits a { color: rgba(255, 255, 255, 0.35); text-decoration: none; transition: color 0.3s ease; display: flex; align-items: center; }
        .developer-credits a:hover, .developer-credits a:active { color: rgba(56, 189, 248, 0.9); }
        .developer-credits svg { width: 14px; height: 14px; }
        .dot { font-size: 0.5rem; opacity: 0.4; }

        /* Background Graphics */
        .aurora-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden;
            background: linear-gradient(125deg, #020617, #0f172a, #064e3b, #0c4a6e, #020617);
            background-size: 400% 400%; animation: auroraShift 25s ease-in-out infinite alternate;
            transition: background 1.5s ease;
        }
        .aurora-glow {
            position: absolute; width: 60vw; height: 60vh;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            border-radius: 50%; filter: blur(70px); top: 10%; left: -10%; opacity: 0.25;
            animation: floatGlow 20s ease-in-out infinite alternate; transition: background 1s ease;
        }
        .aurora-glow-2 {
            position: absolute; width: 70vw; height: 70vh;
            background: radial-gradient(circle, var(--glow-secondary) 0%, transparent 70%);
            border-radius: 50%; filter: blur(90px); bottom: -10%; right: -10%; opacity: 0.25;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse; transition: background 1s ease;
        }

        @keyframes auroraShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes floatGlow { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(8vw, -8vh) scale(1.1); } }

        /* Main Content UI */
        .content-container {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; text-align: center; padding: 2rem; width: 100%; max-width: 900px;
        }

        .greeting-box { margin-bottom: 2rem; animation: fadeIn 2s ease-out; }
        .greeting-title { font-size: clamp(1.2rem, 4vw, 2.5rem); font-weight: 600; margin-bottom: 0.5rem; }
        .greeting-wish { font-size: clamp(0.9rem, 2.5vw, 1.2rem); font-weight: 300; color: rgba(255,255,255,0.7); max-width: 80%; margin: 0 auto; line-height: 1.4; }

        /* Milestone Badge */
        .milestone-badge {
            display: none; background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000;
            padding: 6px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 800;
            letter-spacing: 3px; margin-bottom: 1rem; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        body.milestone-day .milestone-badge { display: inline-block; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .number-display {
            font-size: clamp(6rem, 22vw, 14rem); font-weight: 800; line-height: 1; margin-bottom: 0.2rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 0 50px var(--glow-color), 0 0 100px var(--glow-secondary);
            animation: gentlePulse 4s ease-in-out infinite; cursor: pointer;
        }
        .ordinal-sup { font-size: 0.35em; vertical-align: super; margin-left: 4px; font-weight: 600; opacity: 0.9; pointer-events: none; }
        @keyframes gentlePulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.02); filter: brightness(1.2); } }

        .subtitle {
            font-size: clamp(0.75rem, 2.5vw, 1.2rem); font-weight: 400; letter-spacing: 5px;
            text-transform: uppercase; color: rgba(255, 255, 255, 0.9); margin-bottom: 2rem;
            animation: fadeIn 2s ease-out;
        }

        /* Buttons & Modals */
        .settings-btn {
            position: absolute; bottom: max(25px, env(safe-area-inset-bottom)); right: max(25px, env(safe-area-inset-right));
            z-index: 20; background: transparent; border: none; color: rgba(255, 255, 255, 0.3);
            cursor: pointer; transition: all 0.3s ease; padding: 15px; touch-action: manipulation;
        }
        .settings-btn:hover, .settings-btn:active { color: white; transform: rotate(45deg); }
        .settings-btn svg { width: 26px; height: 26px; fill: currentColor; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 50; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px;
        }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem; border-radius: 24px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px;
            transform: translateY(20px); transition: transform 0.3s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal.active .modal-content { transform: translateY(0); }
        .modal h3 { font-weight: 600; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .modal p.desc { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; line-height: 1.4; }

        .input-group { text-align: left; margin-bottom: 1.5rem; position: relative; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 0.5rem; }
        .styled-input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: white; font-family: inherit; font-size: 1.1rem; outline: none;
            transition: border 0.3s ease; color-scheme: dark;
        }
        .styled-input:focus { border-color: rgba(56, 189, 248, 0.8); }

        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .flex-row > * { flex: 1; margin-bottom: 0; }
        .divider { margin: 15px 0; font-size: 0.8rem; color: rgba(255,255,255,0.4); text-transform: uppercase; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); margin: 0 10px; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.3s ease; touch-action: manipulation; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary { background: #10b981; color: #020617; }
        .btn-primary:hover, .btn-primary:active { background: #34d399; }
        .btn-secondary { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .btn-secondary:hover, .btn-secondary:active { background: rgba(56, 189, 248, 0.3); }
        .btn-cancel { background: transparent; color: rgba(255, 255, 255, 0.6); margin-top: 10px; }
        .btn-cancel:hover, .btn-cancel:active { color: white; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Confetti Elements */
        .confetti-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; overflow: hidden;
        }
        .confetti {
            position: absolute; width: 8px; height: 16px; top: -20px; animation: fall linear forwards; opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* Adjustments for smaller phones */
        @media (max-width: 450px) {
            .brand-logo { font-size: 0.8rem; left: 20px; top: max(20px, env(safe-area-inset-top)); }
            .developer-credits { font-size: 0.65rem; }
            .settings-btn { right: max(15px, env(safe-area-inset-right)); }
        }
    </style>
</head>
<body>

    <div class="modal" id="setup-modal">
        <div class="modal-content">
            <h3 id="modal-title">Break the Bottle</h3>
            <p class="desc" id="modal-desc">Set up your journey below.</p>

                <label>Your Name</label>

                    <svg style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

                </button>

                <input type="date" id="start-date" class="styled-input" onchange="syncDaysFromDate()">

            </div>

            <button class="btn btn-primary" onclick="saveData()">Save & Continue</button>
            <button class="btn btn-cancel" id="btn-close-modal" onclick="closeModal()" style="display:none;">Cancel</button>
        </div>

    <script>
        const MS_PER_DAY = 1000 * 60 * 60 * 24;
        
        // Expanded motivational quotes
        const wishes = [
            "Stay strong on your journey today.",
            "You are doing incredibly well.",
            "One day at a time. Keep going.",
            "Clarity and strength are yours today.",
            "Every day is a victory. Be proud.",
            "Keep breaking the bottle.",
            "Every choice to stay strong shapes your future.",
            "You are building a life you don't need to escape from.",
            "Progress is quiet, but its results are loud.",
            "Another day of choosing yourself.",
            "Strength isn't never feeling tempted, it's choosing not to give in.",
            "Your future self is thanking you right now.",
            "Clarity is a superpower. You have it today.",
            "Small steps every day lead to massive mountains climbed.",
            "Breathe in strength, exhale doubt.",
            "You've got this, one moment at a time.",
            "Embrace the clear mind and the steady heart.",
            "You are stronger than any craving."
        ];

        // The specific days to trigger a milestone celebration
        const milestoneDays = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
        let isCurrentDayMilestone = false;

        function fireConfetti() {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            
            const colors = ['#fbbf24', '#f472b6', '#38bdf8', '#10b981', '#c084fc', '#ffffff'];
            
            for(let i=0; i<80; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Randomize fall speeds and delays
                const duration = Math.random() * 2 + 2.5; 
                const delay = Math.random() * 0.5;
                
                conf.style.animationDuration = duration + 's';
                conf.style.animationDelay = delay + 's';
                
                container.appendChild(conf);
            }
            
            // Clean up DOM after animation finishes
            setTimeout(() => { container.remove(); }, 5000);
        }

        function fireConfettiIfMilestone() {
            if (isCurrentDayMilestone) {
                fireConfetti();
            }
        }

        function formatDateForInput(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getOrdinalSuffix(n) {
            const absN = Math.abs(n);
            const remainder100 = absN % 100;
            if (remainder100 >= 11 && remainder100 <= 13) return 'th';
            switch (absN % 10) {
                case 1:  return 'st';
                case 2:  return 'nd';
                case 3:  return 'rd';
                default: return 'th';
            }
        }

        function getTimeGreeting(name) {
            const hour = new Date().getHours();
            let timeString = "Good evening";
            if (hour >= 5 && hour < 12) timeString = "Good morning";
            else if (hour >= 12 && hour < 18) timeString = "Good afternoon";
            
            return name ? `${timeString}, ${name}.` : `${timeString}.`;
        }

        function calculateOrdinalDay(startDateStr) {
            const start = new Date(startDateStr + 'T00:00:00Z');
            const now = new Date();
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            
            const diffTime = today - start;
            const fullDaysElapsed = Math.floor(diffTime / MS_PER_DAY);
            
            return fullDaysElapsed >= 0 ? fullDaysElapsed + 1 : fullDaysElapsed;
        }

        function setStartToToday() {
            document.getElementById('start-date').value = formatDateForInput(new Date());
            document.getElementById('current-day-count').value = 1;
        }

        function syncDaysFromDate() {
            const dateVal = document.getElementById('start-date').value;
            if (dateVal) {
                const days = calculateOrdinalDay(dateVal);
                document.getElementById('current-day-count').value = days > 0 ? days : "";
            }
        }

        function syncDateFromDays() {
            const days = parseInt(document.getElementById('current-day-count').value);
            if (!isNaN(days)) {
                const diffDays = days >= 1 ? days - 1 : 0; 
                const d = new Date();
                d.setDate(d.getDate() - diffDays);
                document.getElementById('start-date').value = formatDateForInput(d);
            }
        }

        function openModal() {
            const modal = document.getElementById('setup-modal');
            const cancelBtn = document.getElementById('btn-close-modal');
            
            const savedName = localStorage.getItem('btb_name');
            const savedDate = localStorage.getItem('btb_date');
            
            if (savedName) document.getElementById('user-name').value = savedName;
            if (savedDate) {
                document.getElementById('start-date').value = savedDate;
                syncDaysFromDate();
                cancelBtn.style.display = "block";
                document.getElementById('modal-title').innerText = "Settings";
                document.getElementById('modal-desc').innerText = "Update your details below.";
            } else {
                setStartToToday(); 
                cancelBtn.style.display = "none";
                document.getElementById('modal-title').innerText = "Break the Bottle";
                document.getElementById('modal-desc').innerText = "Set up your journey below.";
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('setup-modal').classList.remove('active');
        }

        function saveData() {
            const name = document.getElementById('user-name').value.trim();
            const date = document.getElementById('start-date').value;

            if (!name || !date) {
                alert("Please enter both your name and a start date.");
                return;
            }

            localStorage.setItem('btb_name', name);
            localStorage.setItem('btb_date', date);
            
            closeModal();
            renderApp();
        }

        function renderApp() {
            const savedName = localStorage.getItem('btb_name');
            const savedDate = localStorage.getItem('btb_date');

            if (!savedName || !savedDate) {
                openModal();
                return;
            }

            document.getElementById('greeting-title').innerText = getTimeGreeting(savedName);
            
            // Generate a random motivational wish based on current date so it stays fixed for the day
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const randomWishIndex = (dayOfYear + savedName.length) % wishes.length;
            document.getElementById('greeting-wish').innerText = wishes[randomWishIndex];

            const currentDayNumber = calculateOrdinalDay(savedDate);
            const counterElement = document.getElementById('day-counter');
            const subtitleElement = document.getElementById('subtitle');
            
            if (currentDayNumber > 0) {
                const suffix = getOrdinalSuffix(currentDayNumber);
                counterElement.innerHTML = `${currentDayNumber}<sup class="ordinal-sup">${suffix}</sup>`;
                subtitleElement.innerText = "DAY OF STRENGTH AND CLARITY";
                
                // --- Milestone Logic ---
                isCurrentDayMilestone = milestoneDays.includes(currentDayNumber);
                if (isCurrentDayMilestone) {
                    document.body.classList.add('milestone-day');
                    // Automatically fire confetti when loading a milestone day
                    setTimeout(() => fireConfetti(), 300);
                } else {
                    document.body.classList.remove('milestone-day');
                }

            } else {
                const daysUntil = Math.abs(currentDayNumber);
                counterElement.innerText = daysUntil;
                subtitleElement.innerText = `DAYS UNTIL JOURNEY BEGINS`;
                document.body.classList.remove('milestone-day');
                isCurrentDayMilestone = false;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
